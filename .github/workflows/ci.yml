name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun test:coverage
        env:
          # Values must pass the Zod env schema (snowflake regex etc.) in case
          # a test transitively loads the real src/utils/env.ts.
          DATABASE_URL: postgres://ci:ci@localhost:5432/fluffboost
          REDIS_URL: redis://localhost:6379
          DISCORD_APPLICATION_ID: "123456789012345678"
          DISCORD_APPLICATION_PUBLIC_KEY: ci-test-public-key
          DISCORD_APPLICATION_BOT_TOKEN: ci-test-bot-token
          OWNER_ID: "123456789012345678"
          MAIN_GUILD_ID: "123456789012345678"
          MAIN_CHANNEL_ID: "123456789012345678"

      - name: Run ESLint
        run: bun run lint:check

      - name: Run TypeScript type check
        run: bun run typecheck

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security audit
        run: bun audit

      - name: Check for outdated packages
        run: bun outdated
        continue-on-error: true

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: fluffboost:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
