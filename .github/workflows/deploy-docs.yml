name: Deploy Docs

# Builds apps/docs (marketing site + docs) and publishes it to GitHub Pages.
# The site is a static export, so it needs no server at runtime.

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      # Root assets the site imports (Open Graph image, header icon, hero poster).
      - "banner.jpg"
      - "assets/brand/animated/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

# The build job runs dependency install scripts, so it gets read-only access.
# Only the deploy job receives Pages write and OIDC token scopes.
permissions:
  contents: read

# Never cancel a Pages deployment midway; a newer push queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run --filter=@fluffboost/docs build
        env:
          # GitHub Pages serves this project site under /<repo>.
          # Delete this (or set it empty) if you move to a custom domain, and
          # also update: apps/docs/lib/site.ts `origin` (which drives
          # sitemap.xml, canonical and og:url), the baseURL and
          # NEXT_PUBLIC_BASE_PATH in apps/docs/playwright.config.ts, the
          # SITE_ORIGIN constant and /fluffboost regexes in
          # apps/docs/e2e/site.spec.ts, and the Guide link in
          # apps/discord/src/commands/about.ts.
          NEXT_PUBLIC_BASE_PATH: /fluffboost

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/docs/out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
