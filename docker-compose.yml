name: fluffboost
services:
  postgres:
    image: 'postgres:18-alpine'
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - 'fluffboost-postgres-data:/var/lib/postgresql'
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-U'
        - postgres
        - '-d'
        - postgres
      interval: 5s
      timeout: 20s
      retries: 10
  redis:
    image: 'redis:8-alpine'
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 20s
      retries: 10
  # Opt-in: `docker compose up -d` starts only Postgres + Redis for local
  # development; run the containerized bot with `docker compose --profile bot up`.
  # The image already runs tini as PID 1, so no `init: true`.
  bot:
    profiles: ['bot']
    build:
      context: .
      dockerfile: apps/discord/Dockerfile
    env_file:
      - path: apps/discord/.env
        required: false
    environment:
      # Inside the container, localhost is the bot itself; use the service names.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
    ports:
      - '127.0.0.1:3000:3000'
    # Covers the shard drain: shard watchdog 20s < SIGKILL 22s < parent 30s.
    stop_grace_period: 35s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  fluffboost-postgres-data: